resources:
  - ../default

patches:
  - path: patch-env.yaml
    target:
      kind: Deployment
      name: controller-manager
  - path: patch-metrics.yaml
    target:
      kind: Deployment
      name: controller-manager
  # Keep after patch-metrics: that patch REPLACES the manager args list, so the
  # appended --mirror-agent-image below would be lost if ordered first.
  - path: patch-manager-flags.yaml
    target:
      kind: Deployment
      name: controller-manager
