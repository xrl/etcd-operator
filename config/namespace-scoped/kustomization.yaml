apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pin every resource into the kv namespace. This rewrites the `system` namespace
# stamped on the manager Deployment, SA, leader-election Role/RoleBinding, the
# metrics Service/ServiceMonitor, the webhook Service, the serving Certificate,
# and the NetworkPolicy.
namespace: kv

resources:
  - ../crd                                 # kept so `kustomize build` is whole; the CRD-install app renders ../crd directly (App 1)
  - ../manager                             # the controller-manager Deployment + system Namespace
  - service_account.yaml                   # controller-manager SA (copied from ../rbac)
  - role.yaml                              # namespaced Role (clusterissuers dropped)
  - role_binding.yaml                      # namespaced RoleBinding
  - leader_election_role.yaml              # already a namespaced Role (copied from ../rbac)
  - leader_election_role_binding.yaml
  - metrics_service.yaml                   # http:8080 metrics Service (A.4)
  - monitor.yaml                           # operator ServiceMonitor, http scheme, release: kvs-prometheus (A.4)
  - allow-metrics-traffic.yaml             # NetworkPolicy gating http:8080 (A.4)
  - webhook_service.yaml                   # webhook serving Service (server runs in-pod; A.5)
  - ../certmanager                         # SelfSigned Issuer + serving Certificate for the webhook (stays in kv)

patches:
  # Args/env: --watch-namespace=kv, --metrics-secure=false, --metrics-bind-address=:8080,
  # WATCH_NAMESPACE, RESTRICT_CLUSTER_ISSUER, digest-pinned OPERATOR_IMAGE (A.2/A.4/D8).
  - path: manager_patch.yaml
  # Mounts the webhook serving cert + exposes the webhook port (server runs in-pod, A.5).
  - path: manager_webhook_patch.yaml
    target:
      kind: Deployment

images:
  # NOTE: config/manager/kustomization.yaml already rewrites the original
  # `controller` name to `etcd-operator:v0.1` at the base, so this overlay
  # transform must match `etcd-operator` (the post-base name), not `controller`.
  - name: etcd-operator
    # DP-1: <ARTIFACTORY_DOCKERHUB_PULLTHROUGH_HOST> = confirmed Docker Hub
    # pull-through Artifactory host (precedent kvs-docker-prod.docker.artifactory.viasat.com).
    # Digest is the published v0.1.0-pre.1 operator image (D12).
    newName: <DP-1 ARTIFACTORY_DOCKERHUB_PULLTHROUGH_HOST>/xrlx/etcd-operator
    digest: sha256:7e64f28cb9f2884e4bb225314292f9d20743213f3845a069a979970645fd8728

# Resolve the serving Certificate dnsNames (SERVICE_NAME.SERVICE_NAMESPACE.svc)
# from the webhook Service name/namespace — same replacement config/default uses.
replacements:
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: .metadata.name
  targets:
    - select:
        kind: Certificate
        group: cert-manager.io
        version: v1
      fieldPaths:
        - .spec.dnsNames.0
        - .spec.dnsNames.1
      options:
        delimiter: '.'
        index: 0
        create: true
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: .metadata.namespace
  targets:
    - select:
        kind: Certificate
        group: cert-manager.io
        version: v1
      fieldPaths:
        - .spec.dnsNames.0
        - .spec.dnsNames.1
      options:
        delimiter: '.'
        index: 1
        create: true
